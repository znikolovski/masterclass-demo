<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>WKND Adventures | Static Stories | Light | 9:16</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&amp;family=Syncopate:wght@700&amp;display=swap">
    <style>
      .wknd-ad .wknd-logo {
        display: block;
        flex-shrink: 0;
        width: 96px;
        height: 96px;
        object-fit: contain;
        object-position: center;
      }
    </style>
  </head>
  <body style="width: 1080px; height: 1920px; margin: 0; padding: 0;">
    <div class="wknd-ad" style="position: relative; width: 1080px; height: 1920px; background-color: #f4f2ef; color: #0f1a14; font-family: 'Instrument Sans', Arial, sans-serif;">
      <img class="wknd-image" src="{{image}}" alt="{{imageDescription}}" width="1080" height="1920" style="position: absolute; top: 0; left: 0; display: block; width: 1080px; height: 1920px; object-fit: cover; object-position: center;">
      <div class="wknd-brand" style="position: absolute; top: 288px; left: 72px; display: flex; align-items: center; gap: 24px; padding: 36px; background-color: #f4f2ef; color: #0f1a14;">
        <img class="wknd-logo" src="{{brand_logo}}" style="{{defaultLogo}}" alt="" aria-hidden="true" width="96" height="96">
        <div>
          <div style="font-family: Syncopate, Arial, sans-serif; font-size: 78px; font-weight: 700; line-height: 84px; letter-spacing: -3px;">WKND</div>
          <div style="margin-top: 12px; font-size: 27px; font-weight: 600; line-height: 36px; letter-spacing: 6px;">ADVENTURES</div>
        </div>
      </div>
      <div class="wknd-copy" style="position: absolute; top: 780px; left: 72px; box-sizing: border-box; width: 816px; min-height: 528px; padding: 60px 48px; background-color: #f4f2ef;">
        <div class="wknd-accent" aria-hidden="true" style="width: 120px; height: 15px; margin-bottom: 48px; background-color: #e8651a;"></div>
        <h1 class="wknd-headline" style="margin: 0; color: #0f1a14; font-family: Syncopate, Arial, sans-serif; font-size: 72px; font-weight: 700; line-height: 90px; letter-spacing: -3px; overflow-wrap: break-word;">{{on_image_text}}</h1>
      </div>
    </div>
  </body>
</html>
