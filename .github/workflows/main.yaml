name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - name: Install Aero Worker runtime dependencies
      run: npm ci --prefix workers/wknd-aero-api --omit=dev
    - run: npm run lint
