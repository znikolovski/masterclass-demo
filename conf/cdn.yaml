kind: 'CDN'
version: '1'
data:
  originSelectors:
    rules:
      - name: route-faq-inline
        when: 
          allOf:
            - { reqProperty: tier, in: ["publish", "preview"] }
            - { reqProperty: domain, equals: "wknd-adventures.run.place" }
            - { reqProperty: originalPath, matches: '(/[^./]+|\.html|/)$' } # routed extensions, with .html extension or without extension
        action:
          type: selectAemOrigin
          originName: edgefunction-faq-inline
      - name: route-rates-injector
        when: 
          allOf:
            - { reqProperty: tier, in: ["publish", "preview"] }
            - { reqProperty: domain, equals: "www.securbank.run.place" }
            - { reqProperty: originalPath, matches: '(/[^./]+|\.html|/)$' } # routed extensions, with .html extension or without extension
        action:
          type: selectAemOrigin
          originName: edgefunction-rates-injector
          skipCache: true